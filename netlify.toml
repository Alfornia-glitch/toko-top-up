[build]
  command = "pnpm run build"
  publish = "build"
  # Every deploy costs credits: skip the build when nothing that ships has changed
  # (docs, tests, AI logs, e2e and tooling edits exit 0 = "ignore this commit").
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src static package.json pnpm-lock.yaml vite.config.ts tsconfig.json netlify.toml"

[build.environment]
  NODE_VERSION = "22"
  # Non-credential config (provider names, bucket name, public URLs) whose values
  # also appear in code/lockfile; exclude them from Netlify's secrets scanner.
  SECRETS_SCAN_OMIT_KEYS = "DB_PROVIDER,STORAGE_PROVIDER,SUPABASE_STORAGE_BUCKET,QRIS_IMAGE_URL,BETTER_AUTH_URL"
